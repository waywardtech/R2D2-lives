name: simulation-ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Verify hosted-CI safety policy
        run: python scripts/verify_ci_safety.py
      - name: Install exact quality toolchain
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Scan tracked secrets and dependency notices
        run: python scripts/verify_repository_hygiene.py
      - name: Verify evidence-gated delivery register
        run: python scripts/verify_delivery_benefit.py
      - name: Verify runtime and boundaries
        run: python scripts/tasks.py bootstrap
      - name: Run full automated suite
        run: python scripts/tasks.py test
      - name: Run deterministic integration smoke
        run: python scripts/tasks.py sim-smoke
      - name: Run Phase 1 stationary simulation
        run: python scripts/tasks.py p1-sim
      - name: Run stationary droid-encounter simulation
        run: python scripts/tasks.py encounter-sim
      - name: Run stationary proof-of-life simulation
        run: python scripts/tasks.py proof-of-life-sim
      - name: Verify documentation and evidence
        run: python scripts/tasks.py docs-check
